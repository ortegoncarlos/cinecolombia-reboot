<script>
// Seeded (deterministic) horde: N walkers, sorted by size so the small far ones are drawn first. The walk frames swap the
// symbol's limb groups (shared by every <use>), every 0.25 s. One hero zombie in front is killed at 3.4 s.
const tl = gsap.timeline({ paused: true }), F = 0.25, END = 3.4, N = 70, W = 480, H = 270;
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
const horde = document.getElementById('horde'), Z = [];
for (let i = 0; i < N; i++) Z.push({ s: 32 + 48 * rnd() ** 1.5, side: rnd(), a: rnd(), b: rnd(), c: rnd() });
Z.sort((p, q) => p.s - q.s).forEach((z, i) => {
  const w = z.s * 0.7, sp = z.s * (0.35 + z.a * 0.5) * 4, el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  el.setAttribute('viewBox', '0 0 21 30'); el.setAttribute('width', w); el.setAttribute('height', z.s); el.setAttribute('shape-rendering', 'crispEdges');
  el.innerHTML = '<use href="#z" class="zs"/>'; el.id = 'z' + i; el.classList.add('z');
  const y = Math.max(0, Math.min(H - z.s, (0.08 + 0.62 * (z.s - 32) / 48 + (z.b - 0.5) * 0.3) * (H - z.s)));
  let x0, x1, y0 = y, y1 = y;
  if (z.side < 0.35) { x0 = W * z.c; x1 = x0 - sp; } else if (z.side < 0.7) { el.classList.add('r'); x0 = W * z.c - w; x1 = x0 + sp; }
  else { x0 = W * z.c; x1 = x0 + (z.b < 0.5 ? -1 : 1) * sp * 0.4; y0 = H - z.s * 0.6 * z.a; y1 = y0 - sp * 0.5; }
  horde.append(el);
  tl.fromTo(el, { x: x0, y: y0 }, { x: x1, y: y1, duration: 4, ease: 'none' }, 0);
});
for (let k = 0, t = 0; t < 4; k++, t += F) {
  tl.set('.ll', { y: k % 2 ? -1 : 0 }, t); tl.set('.lr', { y: k % 2 ? 0 : -1 }, t);
  tl.set('.ar', { y: k % 2 ? 1 : 0 }, t); tl.set('.hd', { x: k % 4 < 2 ? 0 : 1 }, t);
}
tl.fromTo('#kill', { x: 170, y: 160 }, { x: 130, y: 160, duration: END, ease: 'none' }, 0);
tl.set('#kill .zs', { filter: 'brightness(.6) sepia(1) saturate(20) hue-rotate(-40deg)', transformOrigin: '50% 60%' }, END); // red flash
